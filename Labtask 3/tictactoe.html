<!DOCTYPE html>
<html>
<head>
<title>Tic Tac Toe</title>

<style>
body{
    font-family: Arial;
    text-align:center;
}

#board{
    display:grid;
    grid-template-columns: repeat(3,100px);
    gap:5px;
    justify-content:center;
    margin:20px auto;
}

.cell{
    width:100px;
    height:100px;
    border:2px solid black;
    font-size:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

button{
    padding:8px 20px;
    font-size:16px;
}
</style>

</head>
