
<!DOCTYPE html>
<html>
<head>
    <title>Date of Birth Form</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Date of Birth</legend>
            <label>dd</label>
            <input type="text" name="day" size="2">
            <label>mm</label>
            <input type="text" name="month" size="2">
            <label>yyyy</label>
            <input type="text" name="year" size="4"><br><br>
            <input type="submit" value="Submit">
        </fieldset>
    </form>
</body>
</html>
