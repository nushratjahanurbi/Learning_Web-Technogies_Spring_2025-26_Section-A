<!DOCTYPE html>
<html>
<head>
    <title>Person Profile</title>
</head>

<body>

<form enctype="multipart/form-data">

<table border="1" width="700" align="center" cellpadding="10">

    <tr>
        <th colspan="3">
            <h2>PERSON PROFILE</h2>
        </th>
    </tr>

    <tr>
        <td width="200">Name</td>
        <td><input type="text" size="35"></td>
        <td></td>
    </tr>

    <tr>
        <td>Email</td>
        <td><input type="email" size="35"></td>
        <td></td>
    </tr>

    <tr>
        <td>Gender</td>
        <td>
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
            <input type="radio" name="gender"> Other
        </td>
        <td></td>
    </tr>

    <tr>
        <td>Date of Birth</td>
        <td>
            <input type="text" size="3"> /
            <input type="text" size="3"> /
            <input type="text" size="6">
            (dd/mm/yyyy)
        </td>
        <td></td>
    </tr>

    <tr>
        <td>Blood Group</td>
        <td>
            <select>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>O+</option>
                <option>O-</option>
                <option>AB+</option>
                <option>AB-</option>
            </select>
        </td>
        <td></td>
    </tr>

    <tr>
        <td>Degree</td>
        <td>
            <input type="checkbox"> SSC
            <input type="checkbox"> HSC
            <input type="checkbox"> BSc
            <input type="checkbox"> MSc
        </td>
        <td></td>
    </tr>

    <tr>
        <td>Photo</td>
        <td>
            <input type="file">
        </td>
        <td></td>
    </tr>

    <tr>
        <td colspan="3" height="40"></td>
    </tr>

    <tr>
        <td colspan="3" align="right">
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </td>
    </tr>

</table>

</form>

</body>
</html>
